<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | {{ .Site.Params.name }}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a5f'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='32' font-weight='bold' fill='%2334d399' text-anchor='middle'%3EGB%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-200 font-sans antialiased min-h-screen flex items-center justify-center">
  <div class="text-center px-6">
    <p class="text-8xl font-bold text-accent">404</p>
    <h1 class="mt-4 text-3xl font-bold text-primary dark:text-white">Page not found</h1>
    <p class="mt-3 text-gray-500 dark:text-gray-400 max-w-md mx-auto">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ .Site.BaseURL }}"
      class="inline-flex items-center gap-2 mt-8 bg-accent text-white font-semibold px-6 py-3 rounded-lg shadow-lg hover:bg-emerald-700 hover:shadow-xl transition-all duration-200">
      &larr; Back to Home
    </a>
  </div>
</body>
</html>
